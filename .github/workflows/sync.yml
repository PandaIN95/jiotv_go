name: Sync with Upstream

on:
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2 AM UTC
  workflow_dispatch: # You can trigger it manually

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 🧠 IMPORTANT: Replace the URL below with the original repo you forked
      - name: Add upstream remote
        run: git remote add upstream https://github.com/JioTV-Go/jiotv_go.git

      - name: Fetch and merge upstream into main
        run: |
          git fetch upstream
          git checkout main
          git merge upstream/main || true
          git push origin main

      - name: Rebase your modified branch on top of main
        run: |
          git checkout modified
          git rebase main || true
          git push origin modified --force
