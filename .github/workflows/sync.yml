name: Sync with Upstream

on:
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ✅ Add the original repo as upstream
      - name: Add upstream remote
        run: git remote add upstream https://github.com/JioTV-Go/jiotv_go.git

      # ✅ Fetch and merge upstream deploy branch
      - name: Fetch and merge upstream into deploy
        run: |
          git fetch upstream
          git checkout deploy
          git merge upstream/deploy || true
          git push origin deploy

      # ✅ Rebase modified branch only if it exists
      - name: Rebase your modified branch on top of deploy
        run: |
          if git show-ref --verify --quiet refs/heads/modified; then
            git checkout modified
            git rebase deploy || true
            git push origin modified --force
          else
            echo "Branch 'modified' does not exist — skipping rebase."
          fi
